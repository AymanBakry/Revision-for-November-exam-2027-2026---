<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Revision Games – Test Two</title>
<style>
:root{--bg:#f4f1ff;--card:#fff;--tx:#241b3d;--mu:#6b6488;--pr:#6c4bff;--ok:#1fa971;--no:#e5484d;--ln:#ddd6f7}
@media(prefers-color-scheme:dark){:root{--bg:#161227;--card:#221b3b;--tx:#f1edff;--mu:#a79fc7;--ln:#3a3060}}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
.w{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:2px solid var(--ln);border-radius:20px;padding:20px;margin-bottom:14px}
h1{margin:0 0 6px;font-size:26px}
.mu{color:var(--mu);font-size:14px}
input,textarea{width:100%;padding:12px;border-radius:12px;border:2px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit;margin-top:8px}
.en{direction:ltr;text-align:left}
.btn{background:var(--pr);color:#fff;border:0;border-radius:14px;padding:12px 22px;font:inherit;font-weight:700;cursor:pointer}
.btn.g{background:transparent;color:var(--pr);border:2px solid var(--pr)}
.btn:disabled{opacity:.4;cursor:default}
.bar{height:12px;background:var(--ln);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#6c4bff,#ff6bb5);width:0;transition:width .3s}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700;font-size:14px}
.lv{display:inline-block;background:var(--pr);color:#fff;border-radius:99px;padding:3px 12px;font-size:13px;margin-bottom:10px}
.ps{background:var(--bg);border-radius:12px;padding:12px;line-height:1.8;margin-bottom:12px;direction:ltr;text-align:left;max-height:230px;overflow:auto}
.b{background:var(--ln);border-radius:6px;padding:0 6px}.b.cur{background:var(--pr);color:#fff}
.q{font-size:19px;line-height:1.7;direction:ltr;text-align:left;margin:6px 0 14px}
.opt{display:block;width:100%;direction:ltr;text-align:left;background:var(--bg);color:var(--tx);border:2px solid var(--ln);border-radius:14px;padding:13px;margin-bottom:9px;font:inherit;font-size:17px;cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--pr)}.opt.sel{background:var(--pr);color:#fff;border-color:var(--pr);transform:scale(1.02)}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:10px}
.big{font-size:56px;font-weight:800;text-align:center;margin:6px 0}
.st{text-align:center;font-size:38px;letter-spacing:6px}
.rv{border-inline-start:5px solid var(--no);padding:8px 12px;margin:8px 0;background:var(--bg);border-radius:8px;direction:ltr;text-align:left;font-size:15px}
.rv b{color:var(--ok)}
.hide{display:none}

body{background:linear-gradient(-45deg,#ff9a9e,#fad0c4,#a18cd1,#8fd3f4,#84fab0);background-size:400% 400%;animation:bg 18s ease infinite}
@media(prefers-color-scheme:dark){body{background:linear-gradient(-45deg,#2b1055,#3a1c71,#0f3460,#16213e);background-size:400% 400%;animation:bg 18s ease infinite}}
@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
.hd{background:linear-gradient(135deg,#6c4bff,#ff6bb5 60%,#ffb347);color:#fff;border-radius:22px;padding:18px;text-align:center;margin-bottom:14px;box-shadow:0 8px 24px rgba(108,75,255,.35);direction:ltr}
.hd h2{margin:0;font-size:21px;line-height:1.4;text-shadow:0 2px 4px rgba(0,0,0,.25)}
.hd .lg{font-size:44px;display:inline-block;animation:bounce 2s ease-in-out infinite}
.hd small{display:block;opacity:.95;margin-top:4px;font-size:14px}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-8px) rotate(6deg)}}
.ft{background:var(--card);border:2px solid var(--ln);border-radius:20px;padding:14px;margin:16px 0;direction:ltr;text-align:center;font-size:14px;line-height:1.9}
.ft b{color:var(--pr)}.ft span{display:inline-block;margin:0 8px;white-space:nowrap}
.fl{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.fl i{position:absolute;bottom:-60px;font-style:normal;animation:up linear infinite;opacity:.8}
@keyframes up{to{transform:translateY(-115vh) rotate(360deg)}}
.w{position:relative;z-index:1}
.card{animation:pop .35s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.opt:active{transform:scale(.97)}
.st{animation:bounce 1.6s ease-in-out infinite}
</style>
</head>
<body>
<div class="fl" id="fl"></div>
<div class="w">
<div class="hd"><span class="lg">🏫</span><h2>Bilad Al Qadim Primary &amp; Intermediate Boys' School</h2><small>📚 Revision Games · Test Two 🎮</small></div>
<div id="app"></div>
<div class="ft">
<span>🎓 School Principal: <b>Mohamed Ibrahim</b></span>
<span>🎓 School Vice Principal: <b>Abdulah Delaim</b></span><br>
<span>👨‍🏫 Senior Teacher: <b>Abbas Kadem</b></span>
<span>💻 Designing Teacher: <b>Ayman Bakry</b></span>
</div></div>
<script>
(function(){var e=["⭐","📚","✏️","🎈","🚀","🏆","💡","🎨","🌈","🧠","🦋","🎯"],f=document.getElementById("fl");
for(var i=0;i<16;i++){var s=document.createElement("i");s.textContent=e[i%e.length];
s.style.left=(Math.random()*95)+"%";s.style.fontSize=(20+Math.random()*28)+"px";
s.style.animationDuration=(9+Math.random()*12)+"s";s.style.animationDelay=(-Math.random()*20)+"s";f.appendChild(s)}})();
</script>
<script src="script.js"></script>
</body>
</html>
